{% extends "portal/base.html" %}
{% block content %}
<div class="{{ c('card') }}" style="max-width:560px;margin:30px auto">
  <h1>Session notice</h1>
  <p class="{{ c('lead') }}">For your security, sessions on this portal expire after 15 minutes of inactivity. Please keep your payment details ready before you continue.</p>
  <form method="get" action="/portal/tax/review">
    <button class="{{ c('btn') }}" id="{{ c('notice_continue') }}" type="submit">Continue</button>
  </form>
</div>
{% endblock %}
